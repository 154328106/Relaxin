name: Build Relaxin TIPA

on:
  push:
    branches: [ main, liquid-glass-ui, liquid-glass-flat ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid zstd gnu-tar ripgrep dpkg make libmd
        # trustcache: CRKatri's C tool, built from source (links -lmd from libmd)
        git clone --depth 1 https://github.com/CRKatri/trustcache /tmp/trustcache
        export C_INCLUDE_PATH="$(brew --prefix libmd)/include"
        export LIBRARY_PATH="$(brew --prefix libmd)/lib"
        make -C /tmp/trustcache
        sudo make -C /tmp/trustcache install PREFIX=/usr/local

    - name: Select latest Xcode
      run: |
        echo "=== Available Xcode versions ==="
        ls -d /Applications/Xcode_*.app 2>/dev/null || ls /Applications | grep -i xcode
        LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
        if [ -n "$LATEST" ]; then
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
        fi

    - name: Check environment
      run: |
        xcodebuild -version
        swift --version
        which ldid
        zstd --version
        which trustcache
        dpkg-deb --version | head -1

    - name: Build TIPA (Dopamine UI + Relaxin RootHide)
      # Use the shipped traditional AppIcon.appiconset (Dopamine's blue icon).
      run: make tipa APPICON_NAME=AppIcon

    - name: Upload TIPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: relaxin-tipa
        path: build/Artifacts/*.tipa
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/Artifacts/*.tipa
