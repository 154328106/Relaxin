name: Build Relaxin TIPA

on:
  push:
    branches: [ main, liquid-glass-ui, liquid-glass-ui-clean, liquid-glass-ui-clean-051-redo ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build the source app or graft GroupedGlass onto an audited upstream app
        required: true
        default: source
        type: choice
        options:
        - source
        - hybrid-048
        - hybrid-049
        - hybrid-050
        - hybrid-051
      upstream_url:
        description: Direct URL for the audited upstream IPA/TIPA (hybrid mode only)
        required: false
        type: string
      upstream_sha256:
        description: SHA-256 for the upstream IPA/TIPA (hybrid mode only)
        required: false
        type: string

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid zstd gnu-tar ripgrep dpkg make libmd
        # trustcache: CRKatri's C tool, built from source (links -lmd from libmd)
        git clone --depth 1 https://github.com/CRKatri/trustcache /tmp/trustcache
        export C_INCLUDE_PATH="$(brew --prefix libmd)/include"
        export LIBRARY_PATH="$(brew --prefix libmd)/lib"
        make -C /tmp/trustcache
        sudo make -C /tmp/trustcache install PREFIX=/usr/local

    - name: Select latest Xcode
      run: |
        echo "=== Available Xcode versions ==="
        ls -d /Applications/Xcode_*.app 2>/dev/null || ls /Applications | grep -i xcode
        LATEST="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
        if [ -n "$LATEST" ]; then
          echo "Selecting: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
        fi

    - name: Check environment
      run: |
        xcodebuild -version
        swift --version
        which ldid
        zstd --version
        which trustcache
        dpkg-deb --version | head -1

    - name: Build source TIPA (GroupedGlass UI + Relaxin RootHide)
      if: github.event_name != 'workflow_dispatch' || inputs.build_mode == 'source'
      # Use the shipped traditional AppIcon.appiconset (Dopamine's blue icon).
      run: make tipa APPICON_NAME=AppIcon

    - name: Download audited Relaxin core
      if: github.event_name == 'workflow_dispatch' && startsWith(inputs.build_mode, 'hybrid-')
      env:
        UPSTREAM_URL: ${{ inputs.upstream_url }}
        UPSTREAM_SHA256: ${{ inputs.upstream_sha256 }}
      run: |
        test -n "$UPSTREAM_URL"
        test -n "$UPSTREAM_SHA256"
        curl --fail --location --retry 3 --output /tmp/relaxin-upstream.tipa "$UPSTREAM_URL"
        printf '%s  %s\n' "$(printf '%s' "$UPSTREAM_SHA256" | tr '[:upper:]' '[:lower:]')" \
          /tmp/relaxin-upstream.tipa | shasum -a 256 --check
        mkdir -p /tmp/relaxin-upstream
        /usr/bin/ditto -x -k /tmp/relaxin-upstream.tipa /tmp/relaxin-upstream
        test -d /tmp/relaxin-upstream/Payload/Relaxin.app
        rm -rf /tmp/relaxin-upstream/Payload/Relaxin.app/_CodeSignature
        rm -f /tmp/relaxin-upstream/Payload/Relaxin.app/embedded.mobileprovision

    - name: Build GroupedGlass TIPA over audited 0.4.8 core
      if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'hybrid-048'
      run: |
        make hybrid-048-tipa \
          APPICON_NAME=AppIcon \
          UPSTREAM_048_APP=/tmp/relaxin-upstream/Payload/Relaxin.app \
          HYBRID_048_OUTPUT=build/Artifacts/Relaxin-0.4.8-GroupedGlass-RootHide-TrueCore.tipa

    - name: Build GroupedGlass TIPA over audited 0.4.9 core
      if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'hybrid-049'
      run: |
        make hybrid-049-tipa \
          APPICON_NAME=AppIcon \
          UPSTREAM_049_APP=/tmp/relaxin-upstream/Payload/Relaxin.app \
          HYBRID_049_OUTPUT=build/Artifacts/Relaxin-0.4.9-GroupedGlass-RootHide-TrueCore.tipa
        cp build/Artifacts/Relaxin-0.4.9-GroupedGlass-RootHide-TrueCore.tipa \
          build/Artifacts/Relaxin-0.4.9-GroupedGlass-RootHide-TrueCore.ipa

    - name: Build GroupedGlass TIPA over audited 0.5.0 core
      if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'hybrid-050'
      run: |
        make hybrid-050-tipa \
          APPICON_NAME=AppIcon \
          UPSTREAM_050_APP=/tmp/relaxin-upstream/Payload/Relaxin.app \
          HYBRID_050_OUTPUT=build/Artifacts/Relaxin-0.5.0-GroupedGlass-RootHide-TrueCore.tipa
        cp build/Artifacts/Relaxin-0.5.0-GroupedGlass-RootHide-TrueCore.tipa \
          build/Artifacts/Relaxin-0.5.0-GroupedGlass-RootHide-TrueCore.ipa

    - name: Build GroupedGlass TIPA over audited 0.5.1 core
      if: github.event_name == 'workflow_dispatch' && inputs.build_mode == 'hybrid-051'
      run: |
        make hybrid-051-tipa \
          APPICON_NAME=AppIcon \
          UPSTREAM_051_APP=/tmp/relaxin-upstream/Payload/Relaxin.app \
          HYBRID_051_OUTPUT=build/Artifacts/Relaxin-0.5.1-GroupedGlass-RootHide-TrueCore.tipa
        cp build/Artifacts/Relaxin-0.5.1-GroupedGlass-RootHide-TrueCore.tipa \
          build/Artifacts/Relaxin-0.5.1-GroupedGlass-RootHide-TrueCore.ipa

    - name: Upload IPA and TIPA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: relaxin-tipa
        path: |
          build/Artifacts/*.tipa
          build/Artifacts/*.ipa
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/Artifacts/*.tipa
          build/Artifacts/*.ipa
