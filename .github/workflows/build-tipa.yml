name: Build Relaxin TIPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install ldid zstd gnu-tar ripgrep dpkg make
        # trustcache: CRKatri's Rust tool, built from source (Rust preinstalled on runner)
        cargo install --git https://github.com/CRKatri/trustcache trustcache
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Check environment
      run: |
        xcodebuild -version
        swift --version
        which ldid
        zstd --version
        which trustcache
        dpkg-deb --version | head -1

    - name: Build TIPA (Dopamine UI + Relaxin RootHide)
      run: make tipa

    - name: Upload TIPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: relaxin-tipa
        path: build/Artifacts/*.tipa
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/Artifacts/*.tipa
